[workspace]
resolver = "3"
members = [
    "crates/zstar",
    "crates/zstar-cli",
    "python",
]
default-members = ["crates/zstar", "crates/zstar-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/brian14708/zstar"

[workspace.dependencies]
async-trait = "0.1"
aws-config = "1.8"
aws-credential-types = "1.3"
aws-runtime = "1.10"
aws-types = "1.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
bytes = "1"
cap-fs-ext = "4"
cap-std = "4"
ciborium = "0.2.2"
clap = "4"
futures-util = "0.3"
fastcdc = "5.0"
hex = "0.4"
httpdate = "1"
lru = "0.19"
object_store = { version = "0.14", default-features = false }
proptest = "1.9"
pyo3 = "0.30"
pyo3-async-runtimes = "0.30"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
zstar = { version = "0.0.1", path = "crates/zstar" }
zstd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The schema documents errors centrally; generated Python APIs and
# ownership-taking async/FFI boundaries do not follow every Rust style heuristic.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
# Keep explicit wire-field arithmetic and parser flow close to the specification.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
manual_let_else = "allow"
unreadable_literal = "allow"
decimal_bitwise_operands = "allow"
similar_names = "allow"
ref_option = "allow"
too_many_lines = "allow"
# Local trait imports keep platform-specific APIs at their call sites.
items_after_statements = "allow"
