[workspace]
resolver = "3"
members = ["crates/zstar", "crates/zstar-cli", "python"]
default-members = ["crates/zstar", "crates/zstar-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/brian14708/zstar"

[workspace.dependencies]
async-trait = "0.1"
aws-config = "1.8"
aws-credential-types = "1.3"
aws-runtime = "1.10"
aws-types = "1.7"
bytes = "1"
cap-fs-ext = "4"
cap-std = "4"
ciborium = "0.2.2"
clap = "4"
fastcdc = "5.0"
futures-util = "0.3"
hex = "0.4"
object_store = { version = "0.14", default-features = false }
proptest = "1.9"
pyo3 = "0.30"
pyo3-async-runtimes = "0.30"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zstar = { version = "0.0.1", path = "crates/zstar" }
zstd = "0.14"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
