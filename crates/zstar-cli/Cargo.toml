[package]
name = "zstar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line capture, inspection and restoration for Zstar archives"
readme = "README.md"
keywords = ["tar", "zstd", "archive", "cli"]
categories = ["command-line-utilities", "compression", "filesystem"]

[[bin]]
name = "zstar"
path = "src/main.rs"
doc = false

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-runtime.workspace = true
aws-types.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zstar = { workspace = true, features = ["fs", "s3"] }

[dev-dependencies]
zstd.workspace = true

[lints]
workspace = true
