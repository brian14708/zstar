[package]
name = "zstar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Blocking and async indexed tar archive readers and writers"
readme = "README.md"
keywords = ["tar", "zstd", "archive", "seekable", "async"]
categories = ["compression", "filesystem", "asynchronous"]

[features]
default = ["async"]
fs = ["dep:cap-fs-ext", "dep:cap-std"]
http = ["async", "dep:reqwest"]
s3 = ["http", "dep:object_store", "dep:quick-xml"]
async = ["dep:tokio", "dep:async-trait", "dep:bytes", "dep:futures-util"]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
ciborium.workspace = true
fastcdc.workspace = true
futures-util = { workspace = true, optional = true }
object_store = { workspace = true, optional = true, features = ["aws"] }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
zstd.workspace = true

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }

[[example]]
name = "blocking_file"
required-features = ["fs"]

[[example]]
name = "in_memory"
required-features = ["async"]

[[example]]
name = "local_range"
required-features = ["fs", "async"]

[[example]]
name = "tutorial_file"
required-features = ["fs", "async"]

[[example]]
name = "tutorial_s3"
required-features = ["s3"]

[[test]]
name = "transport"
required-features = ["http"]

[[test]]
name = "storage"
required-features = ["s3"]

[[test]]
name = "rustfs"
required-features = ["s3"]

[[test]]
name = "hardening_http"
required-features = ["http"]

[[test]]
name = "hardening_s3"
required-features = ["s3"]

[lints]
workspace = true
