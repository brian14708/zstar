name: Packages
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package family to build and attest
        required: true
        type: choice
        default: all
        options: [all, rust, python, go]
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.select.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: python3 tools/release/package_family.py
  go:
    needs: select
    if: needs.select.outputs.package == 'all' || needs.select.outputs.package == 'go'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Go module source archive
        run: python3 tools/release/package_go.py
      - name: Test the packaged Go module
        run: |
          candidate=$(mktemp -d)
          tar -xzf dist/go/*.tar.gz -C "$candidate" --strip-components=1
          cd "$candidate"
          go test -race ./...
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/go/*
      - uses: actions/upload-artifact@v7
        with:
          name: go-packages
          path: dist/go/
          if-no-files-found: error
  rust:
    needs: select
    if: needs.select.outputs.package == 'all' || needs.select.outputs.package == 'rust'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Require a clean tree
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: nix develop --command bash -euo pipefail -c 'cargo test --locked --workspace --all-features; cargo test --locked -p zstar --no-default-features'
      - run: nix develop --command python3 tools/release/package_rust.py
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rust/*
      - uses: actions/upload-artifact@v7
        with:
          name: rust-packages
          path: dist/rust/
          if-no-files-found: error
  python-sdist:
    needs: select
    if: needs.select.outputs.package == 'all' || needs.select.outputs.package == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Require a clean tree
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Build and verify the single source distribution
        run: nix develop --command python3 tools/release/package_python.py --sdist-only
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/python/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/python/
          if-no-files-found: error
  python:
    needs: select
    if: needs.select.outputs.package == 'all' || needs.select.outputs.package == 'python'
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Require a clean tree
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: |
          if [ "${{ runner.os }}" = Linux ]; then
            nix develop --command python3 tools/release/package_python.py --wheels-only --manylinux
          else
            nix develop --command python3 tools/release/package_python.py --wheels-only
          fi
      - name: Audit and test candidate artifact with system Python
        run: |
          nix develop --command bash -euo pipefail <<'SH'
            wheels=(dist/python/*-cp311-abi3-*.whl)
            test "${#wheels[@]}" = 1
            uv tool run --from abi3audit==0.0.26 abi3audit --strict --report "${wheels[0]}"
            uv sync --locked --only-group test --python "$(command -v python3)"
            uv pip install --python .venv/bin/python --reinstall "${wheels[0]}"
            env -u PYTHONPATH uv run --no-sync python -I -m pyrefly check --min-severity=warn --config python/pyproject.toml --search-path python/src python/src/zstar
            env -u PYTHONPATH uv run --no-sync python -I -m pyrefly check --min-severity=warn --config python/pyproject.toml python/tests/typing_api.py
            uv run --no-sync python -I -m pytest python/tests
          SH
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/python/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages-${{ matrix.os }}
          path: dist/python/
          if-no-files-found: error
  python-windows:
    needs: select
    if: needs.select.outputs.package == 'all' || needs.select.outputs.package == 'python'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Require a clean tree
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - run: python -m pip install uv==0.13.1
      - name: Build source distribution and Windows wheel
        run: |
          uv sync --locked --only-group test --python "$(python -c 'import sys; print(sys.executable)')"
          uv run --no-sync python tools/release/package_python.py --wheels-only
      - name: Audit and test candidate with system Python
        run: |
          wheels=(dist/python/*-cp311-abi3-win_amd64.whl)
          test "${#wheels[@]}" = 1
          uv tool run --from abi3audit==0.0.26 abi3audit --strict --report "${wheels[0]}"
          uv pip install --python .venv/Scripts/python.exe --reinstall "${wheels[0]}"
          env -u PYTHONPATH uv run --no-sync python -I -m pyrefly check --min-severity=warn --config python/pyproject.toml --search-path python/src python/src/zstar
          env -u PYTHONPATH uv run --no-sync python -I -m pyrefly check --min-severity=warn --config python/pyproject.toml python/tests/typing_api.py
          uv run --no-sync python -I -m pytest python/tests
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/python/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages-windows-latest
          path: dist/python/
          if-no-files-found: error
  publish-crates:
    needs: rust
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish Rust crates in dependency order
        run: |
          nix develop --command cargo publish --locked -p zstar
          nix develop --command cargo publish --locked -p zstar-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  publish-pypi:
    needs: [python-sdist, python, python-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: artifacts/
      - name: Verify and collect Python distributions
        run: |
          for artifact in artifacts/python-*; do
            (cd "$artifact" && sha256sum --check SHA256SUMS)
          done
          mkdir -p dist/python
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp -t dist/python/ {} +
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
